services:
  nightshift:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DESK_DB: /desk/runtime/desk.sqlite
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_TRACKER_API_KEY: ${SOLANA_TRACKER_API_KEY:-}
      SMART_WALLETS: ${SMART_WALLETS:-}
    volumes:
      - paper-ledger:/desk/runtime
      - token-thumbnails:/desk/public/assets/tokens
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=5)); assert time.time()-h['worker_heartbeat']<120"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  paper-ledger:
  token-thumbnails:
